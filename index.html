<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Bot Hosting Platform</title>
  <style>
    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: linear-gradient(135deg, #23272a 0%, #5865f2 100%);
      color: #fff;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: rgba(40, 48, 72, 0.85);
      box-shadow: 0 4px 32px 0 rgba(88,101,242,0.2);
      padding: 2rem 1rem 1.5rem 1rem;
      text-align: center;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      position: relative;
      z-index: 2;
    }
    header h1 {
      font-size: 2.8rem;
      letter-spacing: 2px;
      margin: 0;
      background: linear-gradient(90deg, #fff 30%, #5865f2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 900;
      text-shadow: 0 2px 16px #5865f2aa;
    }
    main {
      max-width: 420px;
      margin: 3rem auto 2rem auto;
      background: rgba(44,47,51,0.7);
      box-shadow: 0 8px 32px 0 rgba(88,101,242,0.25);
      padding: 2.5rem 2rem 2rem 2rem;
      border-radius: 24px;
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(88,101,242,0.15);
      position: relative;
      z-index: 1;
    }
    h2 {
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #b3baff;
      text-shadow: 0 1px 8px #5865f2aa;
    }
    label {
      display: block;
      margin: 1.2rem 0 0.5rem 0.2rem;
      font-size: 1rem;
      color: #b3baff;
      font-weight: 500;
    }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 0.7rem 1rem;
      margin-bottom: 1.2rem;
      border-radius: 8px;
      border: 1.5px solid #5865f2;
      background: rgba(35,39,42,0.7);
      color: #fff;
      font-size: 1rem;
      transition: border 0.2s;
      outline: none;
    }
    input:focus {
      border: 1.5px solid #b3baff;
      background: rgba(88,101,242,0.1);
    }
    button {
      width: 100%;
      padding: 0.8rem 0;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #5865f2 60%, #b3baff 100%);
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      box-shadow: 0 2px 12px 0 #5865f288;
      cursor: pointer;
      margin-bottom: 1.2rem;
      transition: background 0.2s, box-shadow 0.2s;
    }
    button:hover {
      background: linear-gradient(90deg, #b3baff 0%, #5865f2 100%);
      box-shadow: 0 4px 24px 0 #5865f2cc;
    }
    .bot-list {
      margin-top: 2.5rem;
    }
    .bot-item {
      background: rgba(88,101,242,0.15);
      padding: 1.2rem 1rem 1rem 1rem;
      border-radius: 12px;
      margin-bottom: 1.2rem;
      box-shadow: 0 2px 12px 0 #5865f244;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      border: 1.5px solid #5865f2;
      transition: box-shadow 0.2s, border 0.2s;
    }
    .bot-item strong {
      font-size: 1.2rem;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 0.2rem;
    }
    .bot-item .status {
      font-size: 0.98rem;
      color: #b3baff;
      margin-bottom: 0.7rem;
    }
    .bot-item .actions {
      display: flex;
      gap: 0.7rem;
    }
    .bot-item .actions button {
      width: auto;
      padding: 0.5rem 1.2rem;
      font-size: 1rem;
      margin-bottom: 0;
      background: linear-gradient(90deg, #23272a 0%, #5865f2 100%);
      border: 1.5px solid #b3baff;
      box-shadow: none;
      color: #b3baff;
      transition: background 0.2s, color 0.2s;
    }
    .bot-item .actions button:hover {
      background: linear-gradient(90deg, #5865f2 0%, #23272a 100%);
      color: #fff;
    }
    @media (max-width: 600px) {
      main { padding: 1.2rem 0.5rem; }
      header { padding: 1.2rem 0.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Discord Bot Hosting</h1>
  </header>
  <main>
    <h2>Host a Discord Bot from GitHub</h2>
    <form id="repoForm">
      <label for="repoUrl">GitHub Repository URL</label>
      <input type="text" id="repoUrl" placeholder="https://github.com/username/repo" required>
      <label>Environment Variables</label>
      <div id="envVarsList"></div>
      <button type="button" id="addEnvVarBtn" style="margin-bottom:1.2rem;background:#23272a;color:#b3baff;">+ Add Variable</button>
      <button type="submit">Launch Bot</button>
    </form>
    <div id="terminalContainer" style="display:none; margin-top:2.5rem;">
      <h2>Bot Terminal</h2>
      <div id="terminal" style="background:#181c20; color:#b3baff; font-family:monospace; border-radius:8px; padding:1rem; min-height:180px; max-height:320px; overflow-y:auto; box-shadow:0 2px 12px #5865f244; border:1.5px solid #5865f2;">
        <span style="color:#5865f2;">$</span> Waiting to launch bot...
      </div>
      <button id="stopBotBtn" style="margin-top:1.2rem; background:#b33a3a; color:#fff;">Stop Bot</button>
    </div>
  </main>
  <script>
    // --- ENV VARS DYNAMIC UI ---
    function createEnvVarRow(name = '', value = '') {
      const row = document.createElement('div');
      row.style.display = 'flex';
      row.style.gap = '0.5rem';
      row.style.marginBottom = '0.7rem';
      row.innerHTML = `
        <input type="text" placeholder="Name" value="${name}" style="flex:1; padding:1rem 1.2rem; border-radius:8px; border:1.5px solid #5865f2; background:rgba(35,39,42,0.7); color:#fff; font-size:1.15rem;" required>
        <input type="text" placeholder="Value" value="${value}" style="flex:2; padding:1rem 1.2rem; border-radius:8px; border:1.5px solid #5865f2; background:rgba(35,39,42,0.7); color:#fff; font-size:1.15rem;" required>
        <button type="button" style="background:#b33a3a;color:#fff;padding:0.2rem 0.5rem;font-size:1rem;border-radius:4px;border:none;font-weight:700;line-height:1;">&times;</button>
      `;
      row.querySelector('button').onclick = () => {
        row.remove();
      };
      return row;
    }
    function getEnvVarsFromUI() {
      const list = document.getElementById('envVarsList');
      const vars = [];
      list.querySelectorAll('div').forEach(row => {
        const inputs = row.querySelectorAll('input');
        if (inputs[0].value && inputs[1].value) {
          vars.push({ name: inputs[0].value, value: inputs[1].value });
        }
      });
      return vars;
    }
    function setEnvVarsUI(vars) {
      const list = document.getElementById('envVarsList');
      list.innerHTML = '';
      (vars && vars.length ? vars : [{name:'',value:''}]).forEach(v => {
        list.appendChild(createEnvVarRow(v.name, v.value));
      });
    }
    document.getElementById('addEnvVarBtn').onclick = function() {
      document.getElementById('envVarsList').appendChild(createEnvVarRow());
    };
    function setCookie(name, value, days) {
      let expires = '';
      if (days) {
        const date = new Date();
        date.setTime(date.getTime() + (days*24*60*60*1000));
        expires = '; expires=' + date.toUTCString();
      }
      document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/';
    }
    function getCookie(name) {
      const nameEQ = name + '=';
      const ca = document.cookie.split(';');
      for(let i=0;i < ca.length;i++) {
        let c = ca[i];
        while (c.charAt(0)==' ') c = c.substring(1,c.length);
        if (c.indexOf(nameEQ) == 0) return decodeURIComponent(c.substring(nameEQ.length,c.length));
      }
      return null;
    }

    // Restore previous session
    window.onload = function() {
      const repoUrl = getCookie('repoUrl');
      let envVars = [];
      try { envVars = JSON.parse(getCookie('envVars') || '[]'); } catch {}
      if (repoUrl) document.getElementById('repoUrl').value = repoUrl;
      setEnvVarsUI(envVars);
      if (getCookie('botRunning') === 'true') {
        showTerminal();
        appendTerminal('Restored session. Bot is running...');
      }
    };

    // Terminal helpers
    function appendTerminal(text) {
      const terminal = document.getElementById('terminal');
      terminal.innerHTML += '<br>' + text;
      terminal.scrollTop = terminal.scrollHeight;
    }
    function clearTerminal() {
      document.getElementById('terminal').innerHTML = '<span style="color:#5865f2;">$</span> Waiting to launch bot...';
    }
    function showTerminal() {
      document.getElementById('terminalContainer').style.display = '';
    }
    function hideTerminal() {
      document.getElementById('terminalContainer').style.display = 'none';
    }

    // Handle repo form
    document.getElementById('repoForm').onsubmit = function(e) {
      e.preventDefault();
      const repoUrl = document.getElementById('repoUrl').value.trim();
      const envVars = getEnvVarsFromUI();
      setCookie('repoUrl', repoUrl, 7);
      setCookie('envVars', JSON.stringify(envVars), 7);
      setCookie('botRunning', 'true', 7);
      clearTerminal();
      showTerminal();
      appendTerminal('Cloning repo: ' + repoUrl);
      setTimeout(() => {
        appendTerminal('Installing dependencies...');
        setTimeout(() => {
          appendTerminal('Setting environment variables...');
          envVars.forEach(v => appendTerminal(`<span style=\"color:#b3baff;\">${v.name}=${v.value}</span>`));
          setTimeout(() => {
            appendTerminal('Launching bot...');
            setTimeout(() => {
              appendTerminal('<span style="color:#4caf50;">Bot is running! (simulated)</span>');
            }, 1200);
          }, 1000);
        }, 1200);
      }, 1000);
    };

    // Stop bot
    document.getElementById('stopBotBtn').onclick = function() {
      setCookie('botRunning', 'false', 7);
      appendTerminal('<span style="color:#b33a3a;">Bot stopped.</span>');
      setTimeout(hideTerminal, 1200);
    };
  </script>
</body>
</html>
